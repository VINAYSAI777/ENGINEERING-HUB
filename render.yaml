services:
  - type: web
    name: engineering-hub
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_PATH
        value: /var/data/engineering_hub.db
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
    disk:
      name: engineering-hub-data
      mountPath: /var/data
      sizeGB: 1
